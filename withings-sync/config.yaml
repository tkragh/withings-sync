name: Withings → Garmin Sync
version: "1.1"
slug: withings-sync
description: Sync Withings blood pressure to Garmin with status reporting
startup: services
boot: manual
arch:
  - amd64
  - armv7
  - aarch64
options:
  garmin_user: ""
  garmin_pass: ""
  garmin_option: ""
schema:
  garmin_user: str
  garmin_pass: password
environment:
  GARMIN_USER: "{{ options.garmin_user }}"
  GARMIN_PASS: "{{ options.garmin_pass }}"
map:
  - addon_config:rw
